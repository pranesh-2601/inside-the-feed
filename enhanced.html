<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSIDE THE FEED | X-Ray Algorithm Experience</title>
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3efe6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{position:relative;width:100%;height:100%;background:#f3efe6}
    .shell iframe{width:100%;height:100%;border:0;display:block;background:#f3efe6}
    .boot{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#f3efe6;color:#11110f;transition:opacity .3s ease,visibility .3s ease}
    .boot.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .boot-mark{width:58px;height:58px;border:3px solid #11110f;display:grid;place-items:center;box-shadow:7px 7px 0 #ff4d2e;animation:pulse 1.1s steps(2,end) infinite}
    .boot-mark:before{content:"X";font:900 24px/1 ui-monospace,monospace}
    .boot-title{font-family:Georgia,serif;font-size:22px;font-weight:700}
    .boot-sub{font-size:11px;color:#6e6a61;font-family:ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}
    @keyframes pulse{50%{transform:translate(-2px,-2px);box-shadow:9px 9px 0 #ff4d2e}}
  </style>
  <script src="./xray-theme.js?v=4" defer></script>
</head>
<body>
  <div class="shell">
    <div class="boot" id="boot-screen">
      <div class="boot-mark"></div>
      <div class="boot-title">Inside the Feed</div>
      <div class="boot-sub">Exposing the invisible layer</div>
    </div>
    <iframe id="feed-frame" src="./index.html?xray=4" title="Inside The Feed interactive simulation" allow="autoplay"></iframe>
  </div>
</body>
</html>
