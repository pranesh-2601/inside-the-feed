<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSIDE THE FEED | Interactive Algorithm Experience</title>
  <meta name="theme-color" content="#060913">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060913;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 35%,rgba(0,240,255,.08),transparent 34%),#060913}.shell iframe{width:100%;height:100%;border:0;display:block;background:#060913}.boot{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#060913;color:#f8fafc;transition:opacity .35s ease,visibility .35s ease}.boot.hidden{opacity:0;visibility:hidden;pointer-events:none}.boot-mark{width:54px;height:54px;border:2px solid #00f0ff;border-radius:18px;display:grid;place-items:center;box-shadow:0 0 34px rgba(0,240,255,.42);animation:pulse 1.25s ease-in-out infinite}.boot-mark:before{content:"";width:13px;height:13px;border-radius:50%;background:#00f0ff;box-shadow:0 0 18px #00f0ff}.boot-title{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.boot-sub{font-size:12px;color:#64748b;font-family:ui-monospace,monospace}@keyframes pulse{50%{transform:scale(.94);box-shadow:0 0 18px rgba(0,240,255,.25)}}
  </style>
  <script src="./enhancements.js" defer></script>
  <script src="./adaptive-ui.js" defer></script>
</head>
<body>
  <div class="shell">
    <div class="boot" id="boot-screen">
      <div class="boot-mark"></div>
      <div class="boot-title">Inside The Feed</div>
      <div class="boot-sub">Loading the invisible algorithm…</div>
    </div>
    <iframe id="feed-frame" src="./index.html?enhanced=1" title="Inside The Feed interactive simulation" allow="autoplay"></iframe>
  </div>
</body>
</html>
