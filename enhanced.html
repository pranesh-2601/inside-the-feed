<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSIDE THE FEED | Algorithm Trace</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preload" href="./xray-theme.css?v=6" as="style">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .shell{position:relative;width:100%;height:100%;background:#0a0a0a}
    .shell iframe{width:100%;height:100%;border:0;display:block;background:#0a0a0a;opacity:0;transition:opacity .18s ease}
    .shell iframe.theme-ready{opacity:1}
    .boot{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#0a0a0a;color:#f4f4f0;transition:opacity .2s ease,visibility .2s ease}
    .boot.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .boot-mark{width:54px;height:54px;border:1px solid #333;border-radius:50%;display:grid;place-items:center;position:relative}
    .boot-mark:before{content:"";width:8px;height:8px;border-radius:50%;background:#ff2b2b;box-shadow:0 0 0 7px rgba(255,43,43,.08)}
    .boot-mark:after{content:"";position:absolute;inset:7px;border:1px dashed #30302e;border-radius:50%;animation:spin 2s linear infinite}
    .boot-title{font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    .boot-sub{font-size:10px;color:#777;letter-spacing:.12em;text-transform:uppercase}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script src="./xray-theme.js?v=6" defer></script>
</head>
<body>
  <div class="shell">
    <div class="boot" id="boot-screen">
      <div class="boot-mark"></div>
      <div class="boot-title">Inside The Feed</div>
      <div class="boot-sub">Tracing recommendation signals</div>
    </div>
    <iframe id="feed-frame" src="./index.html?xray=6" title="Inside The Feed interactive simulation" allow="autoplay"></iframe>
  </div>
</body>
</html>
